name: C/C++ CI/CD

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
        - {
            name: "Ubuntu 22.04 GCC",
            os: ubuntu-22.04,
            build_type: "Release",
            c_compiler: "gcc",
            cpp_compiler: "g++",
            doccoverage: true,
            codecoverage: true,
            active: true
          }
        - {
            name: "Windows 2022 MSVC",
            os: windows-latest,
            build_type: "Release",
            c_compiler: "cl",
            cpp_compiler: "cl",
            doccoverage: true,
            codecoverage: true,
            active: true
          }
        - {
            name: "MacOS 13 AppleClang",
            os: macos-13,
            build_type: "Release",
            c_compiler: "clang",
            cpp_compiler: "clang++",
            doccoverage: false,
            codecoverage: false,
            active: true
          }
    env:
      BUILD_TYPE: ${{ matrix.config.build_type }}
      CC: ${{ matrix.config.c_compiler }}
      CXX: ${{ matrix.config.cpp_compiler }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Doxygen
        if: matrix.config.active == true && matrix.config.os == 'ubuntu-22.04'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz
      
      - name: Install lcov/gcovr/coverxygen
        if: matrix.config.active == true && matrix.config.codecoverage == true && matrix.config.os == 'ubuntu-22.04'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov
          pip install gcovr
          pip install coverxygen
          pip install reportgenerator

      - name: Install OpenCppCoverage
        if: matrix.config.active == true && matrix.config.codecoverage == true && matrix.config.os == 'windows-latest'
        shell: bash
        run: |
          pip install reportgenerator
          choco install opencppcoverage

      - name: Create Build Environment
        if: matrix.config.active == true
        run: cmake -E make_directory ${{github.workspace}}/build

      - name: Configure CMake
        if: matrix.config.active == true
        shell: bash
        working-directory: ${{github.workspace}}/build
        run: cmake ${{github.workspace}} -DCMAKE_BUILD_TYPE=$BUILD_TYPE -B ${{github.workspace}}/build

      - name: Build
        if: matrix.config.active == true
        working-directory: ${{github.workspace}}/build
        shell: bash
        run: cmake --build . --config $BUILD_TYPE

      - name: Run Tests (Linux/MacOS)
        if: matrix.config.active == true && (matrix.config.os == 'ubuntu-22.04' || matrix.config.os == 'macos-13')
        working-directory: ${{github.workspace}}/build
        shell: bash
        run: ctest --build-config $BUILD_TYPE --output-on-failure

      - name: Run Tests (Windows)
        if: matrix.config.active == true && matrix.config.os == 'windows-latest'
        working-directory: ${{github.workspace}}/build
        shell: powershell
        run: ctest --build-config $BUILD_TYPE --output-on-failure

      - name: Run Doxygen (Linux)
        if: matrix.config.active == true && matrix.config.os == 'ubuntu-22.04'
        shell: bash
        run: |
          doxygen DoxyfileLibLinux
          doxygen DoxyfileTestLinux
          
      - name: Run Doxygen (Windows)
        if: matrix.config.active == true && matrix.config.os == 'windows-latest'
        shell: powershell
        run: |
          doxygen DoxyfileLibWin
          doxygen DoxyfileTestWin

      - name: Run Gcovr (Linux)
        if: matrix.config.active == true && matrix.config.codecoverage == true && matrix.config.os == 'ubuntu-22.04'
        shell: bash
        run: |
          gcovr -r ./ --xml --output ./docs/coverage/gcovr/coverage_lib.xml --gcov-exclude-directories ".*build.*" --gcov-exclude-directories ".*tests.*" --filter ".*inventory_lib.*"
          gcovr -r ./ --xml --output ./docs/coverage/gcovr/coverage_test.xml --gcov-exclude-directories ".*build.*" --gcov-exclude-directories ".*inventory_lib.*" --filter ".*inventory_lib_test.*"

      - name: Run OpenCppCoverage (Windows)
        if: matrix.config.active == true && matrix.config.codecoverage == true && matrix.config.os == 'windows-latest'
        shell: powershell
        run: |
          OpenCppCoverage --export_type cobertura:docs/coverage/opencpp/coverage_lib.xml --sources ${{github.workspace}}/src/inventory_lib --modules ${{github.workspace}}/build/build/%BUILD_TYPE%/inventory_lib_test.exe -- ${{github.workspace}}/build/build/%BUILD_TYPE%/inventory_lib_test.exe
          OpenCppCoverage --export_type cobertura:docs/coverage/opencpp/coverage_test.xml --sources ${{github.workspace}}/src/tests/inventory_lib_test --modules ${{github.workspace}}/build/build/%BUILD_TYPE%/inventory_lib_test.exe -- ${{github.workspace}}/build/build/%BUILD_TYPE%/inventory_lib_test.exe

      # --- START OF REPORTING FIX ---
      # This section now correctly points to the OS-specific output folders
      
      - name: Generate Code Coverage Report (Windows)
        if: matrix.config.active == true && matrix.config.codecoverage == true && matrix.config.os == 'windows-latest'
        shell: powershell
        run: |
          reportgenerator "-reports:docs/coverage/opencpp/coverage_lib.xml" "-targetdir:docs/coveragereportlibwin" "-reporttypes:Html" "-filefilters:-*.md;-*.xml;-*[generated]"
          reportgenerator "-reports:docs/coverage/opencpp/coverage_test.xml" "-targetdir:docs/coveragereporttestwin" "-reporttypes:Html" "-filefilters:-*.md;-*.xml;-*[generated]"
          reportgenerator "-reports:docs/coverage/opencpp/coverage_lib.xml" "-targetdir:assets/codecoveragelibwin" "-reporttypes:Badges" "-filefilters:-*.md;-*.xml;-*[generated]"
          reportgenerator "-reports:docs/coverage/opencpp/coverage_test.xml" "-targetdir:assets/codecoveragetestwin" "-reporttypes:Badges" "-filefilters:-*.md;-*.xml;-*[generated]"
          
      - name: Generate Code Coverage Report (Linux)
        if: matrix.config.active == true && matrix.config.codecoverage == true && matrix.config.os == 'ubuntu-22.04'
        shell: bash
        run: |
          reportgenerator "-reports:docs/coverage/gcovr/coverage_lib.xml" "-targetdir:docs/coveragereportliblinux" "-reporttypes:Html" "-filefilters:-*.md;-*.xml;-*[generated]"
          reportgenerator "-reports:docs/coverage/gcovr/coverage_test.xml" "-targetdir:docs/coveragereporttestlinux" "-reporttypes:Html" "-filefilters:-*.md;-*.xml;-*[generated]"
          reportgenerator "-reports:docs/coverage/gcovr/coverage_lib.xml" "-targetdir:assets/codecoverageliblinux" "-reporttypes:Badges" "-filefilters:-*.md;-*.xml;-*[generated]"
          reportgenerator "-reports:docs/coverage/gcovr/coverage_test.xml" "-targetdir:assets/codecoveragetestlinux" "-reporttypes:Badges" "-filefilters:-*.md;-*.xml;-*[generated]"

      - name: Run Coverxygen (Library - Linux)
        if: matrix.config.active == true && matrix.config.doccoverage == true && runner.os == 'Linux'
        shell: bash
        run: |
          python3 -m coverxygen --xml-dir ./docs/doxygenliblinux/xml --src-dir ./src/inventory_lib --format lcov --output ./docs/coverxygen/lib/lcov.info

      - name: Run Coverxygen (Test - Linux)
        if: matrix.config.active == true && matrix.config.doccoverage == true && runner.os == 'Linux'
        shell: bash
        run: |
          python3 -m coverxygen --xml-dir ./docs/doxygentestlinux/xml --src-dir ./src/tests/inventory_lib_test --format lcov --output ./docs/coverxygen/test/lcov.info

      - name: Generate Documentation Coverage Report (Linux)
        if: matrix.config.active == true && matrix.config.doccoverage == true && runner.os == 'Linux'
        shell: bash
        run: |
          reportgenerator "-title:Documentation Coverage Report (Library)" "-reports:docs/coverxygen/lib/lcov.info" "-targetdir:docs/coverxygenliblinux" "-reporttypes:Html" "-filefilters:-*.md;-*.xml;-*[generated]"
          reportgenerator "-title:Documentation Coverage Report (Test)" "-reports:docs/coverxygen/test/lcov.info" "-targetdir:docs/coverxygentestlinux" "-reporttypes:Html" "-filefilters:-*.md;-*.xml;-*[generated]"
          reportgenerator "-reports:docs/coverxygen/lib/lcov.info" "-targetdir:assets/doccoverageliblinux" "-reporttypes:Badges" "-filefilters:-*.md;-*.xml;-*[generated]"
          reportgenerator "-reports:docs/coverxygen/test/lcov.info" "-targetdir:assets/doccoveragetestlinux" "-reporttypes:Badges" "-filefilters:-*.md;-*.xml;-*[generated]"

      # --- END OF REPORTING FIX ---

      - name: Upload Artifacts
        if: matrix.config.active == true
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: |
            docs
            assets

  update-docs:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: docs
          path: .

      - name: Commit files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add assets
          git add docs
          git commit -m "Update documentation and coverage badges" -a || true
      
      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.head_ref }}